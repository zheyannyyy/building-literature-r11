[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "building-literature-r11"
version = "0.1.0"
description = "Codex workflow for the V2.1-r11 building literature review"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5"]

[project.scripts]
r11 = "r11_pipeline.cli:run_cli"

[tool.setuptools.packages.find]
where = ["src"]
